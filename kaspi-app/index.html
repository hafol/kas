    <!-- Instant 0ms Inline Kaspi Splash Loader -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #FFFFFF !important;
        color-scheme: light only;
        width: 100%;
        height: 100%;
      }
      #kaspi-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999999;
        pointer-events: none;
        transition: opacity 0.35s ease-out;
      }
      #kaspi-splash img {
        width: 104px;
        height: 104px;
        object-fit: contain;
        animation: kaspiSplashPulse 1.6s ease-in-out infinite alternate;
      }
      @keyframes kaspiSplashPulse {
        0% { transform: scale(0.97); opacity: 0.94; }
        100% { transform: scale(1.0); opacity: 1; }
      }
    </style>
  </head>
