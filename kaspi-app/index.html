    <script>
      (function () {
        // iOS Display Zoom reports a smaller screen. Map "zoomed" screen sizes to the real width.
        // key: screenWidth x screenHeight @ devicePixelRatio  ->  real width in pt
        var ZOOMED = {
          '375x812@2': 414,  // iPhone XR, 11 with Display Zoom (real 414 x 896)
          '375x667@3': 414,  // iPhone 6s/7/8 Plus with Display Zoom (real 414 x 736)
          '320x693@3': 390,  // iPhone 12/13/14, 12/13 Pro, 14 Pro, 15, 16 with Display Zoom (real 390 or 393)
          '320x568@2': 375   // iPhone SE 2/3, 6s/7/8 with Display Zoom (real 375 x 667)
        };
        var isIOS = /iPhone/.test(navigator.userAgent);
        if (!isIOS) return;
        var w = Math.min(screen.width, screen.height);
        var h = Math.max(screen.width, screen.height);
        var key = w + 'x' + h + '@' + Math.round(window.devicePixelRatio);
        var realWidth = ZOOMED[key];
        if (!realWidth) return;
        var scale = w / realWidth; // e.g. 375 / 414 = 0.9058
        var meta = document.querySelector('meta[name=viewport]');
        meta.setAttribute('content',
          'width=' + realWidth + ', initial-scale=' + scale.toFixed(4) +
          ', minimum-scale=' + scale.toFixed(4) + ', maximum-scale=' + scale.toFixed(4) +
          ', user-scalable=no, viewport-fit=cover');
        document.documentElement.setAttribute('data-display-zoom', 'on');
      })();
    </script>
    <script>
      (function() {
        try {
          var payload = {
            screen: { w: screen.width, h: screen.height, dpr: window.devicePixelRatio },
            window: { innerW: window.innerWidth, innerH: window.innerHeight },
            standalone: Boolean(window.navigator.standalone),
            ua: navigator.userAgent
          };
          fetch('/api/debug-log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }).catch(function(){});
        } catch(e) {}
      })();
    </script>

    <!-- Instant 0ms Inline Kaspi Splash Loader -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #FFFFFF;
        color-scheme: light only;
        width: 100%;
        height: 100%;
      }
      #kaspi-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999999;
        pointer-events: none;
        transition: opacity 0.35s ease-out;
      }
      #kaspi-splash img {
        width: 104px;
        height: 104px;
        object-fit: contain;
        animation: kaspiSplashPulse 1.6s ease-in-out infinite alternate;
      }
      @keyframes kaspiSplashPulse {
        0% { transform: scale(0.97); opacity: 0.94; }
        100% { transform: scale(1.0); opacity: 1; }
      }
    </style>

  <body>
    <!-- Instant Splash Screen displayed while app bundle loads -->
    <div id="kaspi-splash">
      <img src="/kaspi-splash-emblem.png?v=kaspi-official-2026" alt="Kaspi.kz" width="104" height="104" />
    </div>
    <script>
      setTimeout(function() {
        var s = document.getElementById('kaspi-splash');
        if (s) {
          s.style.opacity = '0';
          setTimeout(function() { if (s && s.parentNode) s.parentNode.removeChild(s); }, 350);
        }
      }, 1500);
    </script>
